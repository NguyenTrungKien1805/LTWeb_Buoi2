<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Murach's Java Servlets and JSP</title>
    <link rel="stylesheet" href="styles/main.css" type="text/css"/>
</head>
<body>
<img src="styles/img/logo.png" alt="Murach Logo" id="logo">

<h1>Survey</h1>
<p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>

<form action="survey" method="post">
    <input type="hidden" name="action" value="add">

    <h2>Your information:</h2>

    <p>
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required>
    </p>

    <p>
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" required>
    </p>

    <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
    </p>

    <p>
        <label for="dateOfBirth">Date of Birth:</label>
        <input type="date" id="dateOfBirth" name="date_of_birth">
    </p>

    <h2>How did you hear about us?</h2>
    <p>
        <input type="radio" name="hear_about" id="hear_search" value="search_engine" checked>
        <label for="hear_search" class="inline">Search engine</label>

        <input type="radio" name="hear_about" id="hear_word" value="word">
        <label for="hear_word" class="inline">Word of mouth</label>

        <input type="radio" name="hear_about" id="hear_social" value="social">
        <label for="hear_social" class="inline">Social Media</label>

        <input type="radio" name="hear_about" id="hear_other" value="other">
        <label for="hear_other" class="inline">Other</label>
    </p>

    <h2>Would you like to receive announcements<br>about new CDs and special offers?</h2>
    <p>
        <input type="checkbox" id="wants_updates" name="wants_updates" value="YES, I'd like that.">
        <label for="wants_updates" class="inline">YES, I'd like that.</label>
    </p>
    <p>
        <input type="checkbox" id="wants_announcements" name="wants_announcements" value="YES, please send me email announcements.">
        <label for="wants_announcements" class="inline">YES, please send me email announcements.</label>
    </p>

    <p>
        <label for="contact" class="wide-label">Please contact me by:</label>
        <select name="contact" id="contact">
            <option value="or">Email or postal mail</option>
            <option value="email">Email only</option>
            <option value="postal">Postal mail only</option>
        </select>
    </p>

    <p>
        <input type="submit" value="Submit" id="submit">
    </p>
</form>
</body>
</html>
